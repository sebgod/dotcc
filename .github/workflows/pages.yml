name: pages

# Deploy the DotCC.Web in-browser sandbox to GitHub Pages (fable-web.md WEB4).
#
# DotCC.Web is a standalone Blazor WebAssembly app that runs the dotcc compiler
# (DotCC.Lib) in the browser and executes C via the wat backend + libwabt.js: a
# fully static site, no server (see the project README under DotCC.Web/). It lives
# OUTSIDE dotcc.sln + CPM, so the main `ci` workflow never builds it; this workflow
# is its sole CI, and publishes it to https://sebgod.github.io/dotcc/.
#
# Runs on pushes to main that touch the app, the compiler it embeds (so the live
# sandbox tracks the latest compiler) or the CPython example (the programs the Python
# page shows, and the build of python.wasm, which the sandbox's Python mode runs), and
# on manual dispatch for a forced redeploy.
# Pure managed publish target is browser-wasm (OS-neutral), so ubuntu publishes fine.

on:
  push:
    branches: [main]
    paths:
      - 'DotCC.Web/**'
      - 'DotCC.Lib/**'
      - 'DotCC.Libc/**'
      - 'examples/cpython/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancelling it
# (a half-applied Pages deploy is worse than a slightly stale one).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WABT_VERSION: '1.0.36'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Blazor WASM Release publish relinks the runtime natively (Emscripten) to
      # tree-shake it smaller; the wasm-tools workload provides that toolchain.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # NuGet LALR.CC path (no sibling checkout in CI), same as the main ci workflow.
      #
      # RunAOTCompilation: mono-aot-cross compiles the managed code to native wasm at
      # publish time (fable-web.md WEB7), aimed at the ~3.4 s interpreted EmitWat
      # latency measured in WEB0. Deliberately CI-only (never on a local box); plain AOT
      # on ubuntu-x64 first. If this job ever hits the sgen-alloc.c:409
      # 0xC0000409 assertion, the known workarounds are _AOT_InternalForceInterpretAssemblies
      # (identity = the .dll file name) plus -p:WasmDedup=false.
      - name: Publish DotCC.Web (Release, AOT)
        run: dotnet publish DotCC.Web/DotCC.Web.csproj -c Release -o publish -p:UseLocalLalrCc=false -p:RunAOTCompilation=true --nologo

      # The payload budget is part of the campaign's validation story: WEB0 measured
      # 3.31 MB Brotli interpreted; AOT buys latency at a payload cost, so keep it visible.
      - name: Report published payload size
        run: |
          set -euo pipefail
          echo "publish/wwwroot on-disk:"
          du -sh publish/wwwroot
          echo "Brotli (.br) payload total (what the browser actually downloads):"
          find publish/wwwroot -name '*.br' -printf '%s\n' | awk '{s+=$1} END {printf "%.2f MB\n", s/1024/1024}'

      # The sandbox's Python mode (GH #269): CPython 3.13 compiled to wasm by dotcc's wat back
      # end, and its standard library's pack, which the page's worker fetches from python/.
      - name: Install wabt ${{ env.WABT_VERSION }} (pinned + checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}"
          asset="wabt-${WABT_VERSION}-ubuntu-20.04.tar.gz"
          curl -fsSL "$base/$asset" -o "/tmp/$asset"
          curl -fsSL "$base/$asset.sha256" -o "/tmp/$asset.sha256"
          (cd /tmp && sha256sum -c "$asset.sha256")
          tar -xzf "/tmp/$asset" -C /tmp
          echo "/tmp/wabt-${WABT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build dotcc (Release, NuGet path)
        run: dotnet build DotCC/DotCC.csproj -c Release --nologo -p:UseLocalLalrCc=false

      # The key names the pinned tag, so bumping CPYTHON_TAG in fetch.sh misses
      # the cache and fetch.sh clones the new tag.
      - name: Pinned CPython tag
        id: tag
        run: echo "tag=$(grep -oP 'CPYTHON_TAG:-\K[^}]+' examples/cpython/fetch.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache the CPython sources
        uses: actions/cache@v6
        with:
          path: examples/cpython/cpython-src
          key: cpython-src-${{ steps.tag.outputs.tag }}-sparse2

      - name: Fetch CPython (sparse, pinned tag)
        run: bash examples/cpython/fetch.sh

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate the frozen modules and Modules/config.c
        run: PYTHON=python bash examples/cpython/generate.sh

      - name: Compile CPython to python.wasm, pack its standard library
        run: |
          set -euo pipefail
          bash examples/cpython/build-wat.sh
          mkdir -p publish/wwwroot/python
          cp examples/cpython/build-wat/python.wasm publish/wwwroot/python/
          python examples/cpython/pack-stdlib.py examples/cpython/cpython-src/Lib publish/wwwroot/python/stdlib.bin

      - name: Rewrite base href for the /dotcc/ project-site subpath
        run: |
          set -euo pipefail
          idx="publish/wwwroot/index.html"
          # github.io serves this project site under /dotcc/, not root. Local dev
          # keeps <base href="/" />; patch only the published copy.
          sed -i 's|<base href="/" />|<base href="/dotcc/" />|' "$idx"
          grep -q '<base href="/dotcc/" />' "$idx" || { echo "base href not rewritten"; exit 1; }

      - name: SPA 404 fallback + .nojekyll
        run: |
          set -euo pipefail
          # Jekyll strips _framework/ (leading underscore); .nojekyll disables Jekyll.
          touch publish/wwwroot/.nojekyll
          # Static hosts 404 on client-side deep links; GitHub Pages serves 404.html
          # for unknown paths, so a copy of index.html makes routes resolve.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          # It does so with status 404, which link previews and crawlers take at its word.
          # Each page's route gets a copy of its own (sandbox.html for /sandbox), which
          # Pages serves for the extensionless path with status 200, query and all.
          for route in $(sed -n 's|^@page "/\(.\+\)"$|\1|p' DotCC.Web/Pages/*.razor); do
            mkdir -p "publish/wwwroot/$(dirname "$route")"
            cp publish/wwwroot/index.html "publish/wwwroot/$route.html"
            echo "route /$route -> $route.html"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    # Deploy only from main: a branch workflow_dispatch is a build-only validation
    # run (e.g. proving an AOT publish compiles before it can touch the live site).
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
