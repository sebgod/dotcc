name: python

# The Python milestone's CI (GH #201), in its own workflow like lua.yml and
# chibi.yml because it is slower than the unit / fixture gate. It still runs on
# every push to a PR (correctness over speed), plus nightly on main and on demand.
#
#   cpython-probe  compiles each CPython 3.13 translation unit in
#                  examples/cpython/files.txt with dotcc (--emit=obj), against
#                  dotcc's own pyconfig.h and the sources generate.sh makes
#                  (frozen modules, Modules/config.c), and fails when the set that emits
#                  differs from the committed examples/cpython/emits.txt: a unit
#                  that stops emitting is a regression, and one that starts must
#                  be added (probe.sh --update), so the list stays true. It
#                  then links the interpreter from the probe's objects (the
#                  same units, compiled with the same flags) and runs Python on
#                  it: a hello, smoke.py and the pure-Python programs in
#                  programs/ (programs.sh), each of whose output must equal
#                  what host CPython 3.13 prints. The same objects also build
#                  the shared interpreter (libpython as a managed library, a
#                  thin python, _heapq as an extension module it dlopens),
#                  which must import _heapq from its .so and pass the same
#                  runs.
#   cpython-wasm   the same core and boot units compiled whole by dotcc's wat back
#                  end into python.wasm (build-wat.sh), which must run under node
#                  (run-wasm.sh) the hello, smoke.py and every program with the
#                  output host CPython 3.13 prints: the interpreter the browser
#                  sandbox runs (GH #269). It uploads python.wasm and the standard
#                  library's pack.
#   capi-oracle    the <Python.h> shim's differential oracle: CPythonOracleTests
#                  builds each cpython-oracle.txt fixture with gcc against real
#                  libpython 3.13 and requires dotcc's transcript to match it.
#
# Same conventions as ci.yml: ubuntu-latest, setup-dotnet 10.0.x, NuGet build
# path (no sibling LALR.CC in CI).

on:
  # push runs only on the default branch (merges); the pull_request trigger
  # re-fires on every push to an open PR, so each suite runs once per push.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 03:47 UTC nightly, clear of lua (03:17) and the top of the hour.
    - cron: '47 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpython-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore dotcc.sln

      - name: Build dotcc (Release, NuGet path)
        run: dotnet build DotCC/DotCC.csproj -c Release --no-restore --nologo -p:UseLocalLalrCc=false

      # The key names the pinned tag, so bumping CPYTHON_TAG in fetch.sh misses
      # the cache and fetch.sh clones the new tag.
      - name: Pinned CPython tag
        id: tag
        run: echo "tag=$(grep -oP 'CPYTHON_TAG:-\K[^}]+' examples/cpython/fetch.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache the CPython sources
        uses: actions/cache@v6
        with:
          path: examples/cpython/cpython-src
          key: cpython-src-${{ steps.tag.outputs.tag }}-sparse2

      - name: Fetch CPython (sparse, pinned tag)
        run: bash examples/cpython/fetch.sh

      # generate.sh freezes the startup modules with a host Python of the same
      # minor version (bytecode is stable within 3.13) and writes Modules/config.c,
      # which Python/frozen.c, Modules/getpath.c and Modules/config.c need.
      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate the frozen modules and Modules/config.c
        run: PYTHON=python bash examples/cpython/generate.sh

      - name: Compile every translation unit, compare with emits.txt
        run: bash examples/cpython/probe.sh

      - name: Build the interpreter from the probe's objects, static and shared
        run: BUILD_OBJ=examples/cpython/out/cs BUILD_SHARED=1 bash examples/cpython/build.sh

      # A hang (the interpreter spinning at exit, say) fails in minutes, not at
      # the job's hour.
      - name: Run Python on it
        timeout-minutes: 10
        run: |
          set -euo pipefail
          bash examples/cpython/run.sh -c "print('hello from dotcc-built CPython')"
          bash examples/cpython/run.sh examples/cpython/smoke.py > smoke.out
          diff -u examples/cpython/smoke.expected smoke.out
          PROGRAM_TIMEOUT=120 bash examples/cpython/programs.sh

      # The shared interpreter: _heapq has to come from its extension module (the
      # static interpreter has none, so heapq would fall back to Python), and
      # heapq has to pick it up.
      - name: Run Python on the shared build
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export PY_SHARED=1
          bash examples/cpython/run.sh -c "import _heapq, heapq; assert _heapq.__file__.endswith('.so'), _heapq.__file__; assert heapq.heappush is _heapq.heappush; h = [5, 1, 4, 2, 3]; _heapq.heapify(h); print('_heapq from', _heapq.__file__, [_heapq.heappop(h) for _ in range(5)])"
          bash examples/cpython/run.sh examples/cpython/smoke.py > smoke-shared.out
          diff -u examples/cpython/smoke.expected smoke-shared.out
          PROGRAM_TIMEOUT=120 bash examples/cpython/programs.sh

      - name: Upload the probe's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpython-probe
          path: |
            examples/cpython/out/results.tsv
            examples/cpython/out/summary.txt
            examples/cpython/out/cs/*.log
          if-no-files-found: ignore

  cpython-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WABT_VERSION: '1.0.36'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install wabt ${{ env.WABT_VERSION }} (pinned + checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}"
          asset="wabt-${WABT_VERSION}-ubuntu-20.04.tar.gz"
          curl -fsSL "$base/$asset" -o "/tmp/$asset"
          curl -fsSL "$base/$asset.sha256" -o "/tmp/$asset.sha256"
          (cd /tmp && sha256sum -c "$asset.sha256")
          tar -xzf "/tmp/$asset" -C /tmp
          echo "/tmp/wabt-${WABT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build dotcc (Release, NuGet path)
        run: dotnet build DotCC/DotCC.csproj -c Release --nologo -p:UseLocalLalrCc=false

      # The key names the pinned tag, so bumping CPYTHON_TAG in fetch.sh misses
      # the cache and fetch.sh clones the new tag.
      - name: Pinned CPython tag
        id: tag
        run: echo "tag=$(grep -oP 'CPYTHON_TAG:-\K[^}]+' examples/cpython/fetch.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache the CPython sources
        uses: actions/cache@v6
        with:
          path: examples/cpython/cpython-src
          key: cpython-src-${{ steps.tag.outputs.tag }}-sparse2

      - name: Fetch CPython (sparse, pinned tag)
        run: bash examples/cpython/fetch.sh

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate the frozen modules and Modules/config.c
        run: PYTHON=python bash examples/cpython/generate.sh

      - name: Compile CPython to python.wasm
        run: bash examples/cpython/build-wat.sh

      - name: Run Python on it
        timeout-minutes: 30
        working-directory: examples/cpython
        run: |
          set -euo pipefail
          bash run-wasm.sh -c "print('hello from python.wasm')"
          bash run-wasm.sh smoke.py > smoke-wasm.out
          diff -u smoke.expected smoke-wasm.out
          RUN=run-wasm.sh PROGRAM_TIMEOUT=600 bash programs.sh

      - name: Pack the standard library for the sandbox
        run: python examples/cpython/pack-stdlib.py examples/cpython/cpython-src/Lib examples/cpython/build-wat/stdlib.bin

      - name: Upload python.wasm and the standard library's pack
        uses: actions/upload-artifact@v7
        with:
          name: python-wasm
          path: |
            examples/cpython/build-wat/python.wasm
            examples/cpython/build-wat/stdlib.bin

  capi-oracle:
    runs-on: ubuntu-latest
    env:
      DOTCC_RUN_CPYTHON_ORACLE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The oracle builds with `gcc` and `python3.13-config --embed`, which
      # Ubuntu 24.04 does not ship (its python3 is 3.12). deadsnakes has 3.13.
      # Assert both are present: the test skips (not fails) without them, and a
      # silent skip would make this job a green no-op.
      - name: Install Python 3.13 headers and libpython
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get install -y --no-install-recommends python3.13-dev
          gcc --version | head -1
          python3.13-config --embed --ldflags

      - name: Restore
        run: dotnet restore dotcc.sln

      - name: Build (Release, NuGet path)
        run: dotnet build dotcc.sln -c Release --no-restore --nologo -p:UseLocalLalrCc=false

      - name: CPython differential oracle (gcc + libpython 3.13 per fixture)
        run: >
          dotnet test DotCC.FunctionalTests/DotCC.FunctionalTests.csproj
          -c Release --no-build --nologo --filter "FullyQualifiedName~CPythonOracleTests"
